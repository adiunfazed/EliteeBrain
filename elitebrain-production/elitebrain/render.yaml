services:
  - type: web
    name: elitebrain
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard — never commit them.
      - key: GEMINI_API_KEY
        sync: false
      - key: MERCHANT_UPI_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
